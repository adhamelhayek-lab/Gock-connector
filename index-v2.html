<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta name="theme-color" content="#080a0f" />
  <meta name="color-scheme" content="dark" />

  <title>Gock — AI Engineering Assistant</title>

  <style>
    :root {
      --bg: #080a0f;
      --surface: #0e1118;
      --surface-2: #131720;
      --surface-3: #181d27;

      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.13);

      --text: #f5f7fb;
      --muted: #9299a8;
      --muted-2: #6f7685;

      --accent: #5d9cff;
      --accent-soft: rgba(93, 156, 255, 0.13);
      --accent-glow: rgba(93, 156, 255, 0.28);

      --user: #1c2636;
      --assistant: #10151d;

      --danger: #ff6678;
      --success: #54d69b;

      --radius-lg: 20px;
      --radius-md: 14px;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;

      background: var(--bg);
      color: var(--text);

      overflow: hidden;
    }

    body {
      min-height: 100dvh;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
    }

    /* =====================================================
       APP
       ===================================================== */

    .app {
      width: 100%;
      height: 100dvh;

      display: flex;
      flex-direction: column;

      background:
        radial-gradient(
          circle at 50% -20%,
          rgba(93, 156, 255, 0.09),
          transparent 38%
        ),
        var(--bg);
    }

    /* =====================================================
       HEADER
       ===================================================== */

    .header {
      flex: 0 0 64px;
      height: 64px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding:
        env(safe-area-inset-top)
        14px
        0;

      background: rgba(8, 10, 15, 0.9);

      border-bottom:
        1px solid var(--border);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      z-index: 20;
    }

    .header-left {
      min-width: 0;

      display: flex;
      align-items: center;

      gap: 11px;
    }

    .avatar {
      width: 39px;
      height: 39px;

      flex: 0 0 39px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          #72adff,
          #3973d6
        );

      color: white;

      font-size: 16px;
      font-weight: 800;

      box-shadow:
        0 0 0 1px rgba(255,255,255,0.08),
        0 7px 22px rgba(57,115,214,0.3);
    }

    .identity {
      min-width: 0;
    }

    .name-row {
      display: flex;
      align-items: center;

      gap: 7px;
    }

    .name {
      font-size: 16px;
      line-height: 20px;

      font-weight: 700;

      letter-spacing: -0.01em;
    }

    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--muted-2);

      transition: 0.2s ease;
    }

    .status-dot.online {
      background: var(--success);

      box-shadow:
        0 0 9px rgba(84,214,155,0.65);
    }

    .status-dot.error {
      background: var(--danger);
    }

    .status {
      margin-top: 1px;

      color: var(--muted);

      font-size: 11px;
      line-height: 15px;

      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;

      gap: 5px;
    }

    .icon-button {
      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--muted);

      background: transparent;

      border-radius: 12px;

      cursor: pointer;

      transition:
        background 0.15s ease,
        color 0.15s ease,
        transform 0.1s ease;
    }

    .icon-button:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    .icon-button:active {
      transform: scale(0.94);
    }

    .icon-button svg {
      width: 19px;
      height: 19px;
    }

    /* =====================================================
       CHAT
       ===================================================== */

    .chat {
      flex: 1;
      min-height: 0;

      overflow-y: auto;
      overflow-x: hidden;

      padding:
        22px
        14px
        20px;

      overscroll-behavior-y: contain;

      scroll-behavior: smooth;

      scrollbar-width: thin;
      scrollbar-color:
        rgba(255,255,255,0.12)
        transparent;
    }

    .chat::-webkit-scrollbar {
      width: 4px;
    }

    .chat::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.12);
      border-radius: 10px;
    }

    .conversation {
      width: 100%;
      max-width: 820px;

      margin: 0 auto;
    }

    /* =====================================================
       WELCOME
       ===================================================== */

    .welcome {
      padding:
        28px
        8px
        24px;

      text-align: center;
    }

    .welcome-avatar {
      width: 58px;
      height: 58px;

      margin:
        0
        auto
        15px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 18px;

      background:
        linear-gradient(
          145deg,
          #72adff,
          #3973d6
        );

      color: white;

      font-size: 24px;
      font-weight: 800;

      box-shadow:
        0 12px 38px
        rgba(57,115,214,0.3);
    }

    .welcome h1 {
      margin: 0;

      font-size: 25px;
      line-height: 31px;

      letter-spacing: -0.035em;
    }

    .welcome p {
      max-width: 470px;

      margin:
        9px
        auto
        0;

      color: var(--muted);

      font-size: 14px;
      line-height: 21px;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;

      justify-content: center;

      gap: 8px;

      margin:
        19px
        auto
        0;

      max-width: 650px;
    }

    .suggestion {
      padding:
        9px
        12px;

      color: #c9dcff;

      background:
        var(--accent-soft);

      border:
        1px solid
        rgba(93,156,255,0.15);

      border-radius: 999px;

      font-size: 12px;
      line-height: 16px;

      cursor: pointer;

      transition:
        background 0.15s ease,
        transform 0.1s ease;
    }

    .suggestion:hover {
      background:
        rgba(93,156,255,0.2);
    }

    .suggestion:active {
      transform: scale(0.97);
    }

    /* =====================================================
       MESSAGES
       ===================================================== */

    .message {
      display: flex;

      width: 100%;

      margin-bottom: 20px;

      animation:
        message-in
        0.18s
        ease-out;
    }

    @keyframes message-in {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.assistant {
      justify-content: flex-start;
    }

    .message-content {
      max-width:
        min(86%, 720px);
    }

    .bubble {
      padding:
        12px
        14px;

      border-radius:
        var(--radius-lg);

      font-size: 15px;
      line-height: 1.58;

      overflow-wrap: anywhere;
    }

    .user .bubble {
      color: var(--text);

      background:
        var(--user);

      border-bottom-right-radius: 6px;

      box-shadow:
        inset 0 1px 0
        rgba(255,255,255,0.025);
    }

    .assistant .bubble {
      color: #eef0f5;

      background:
        var(--assistant);

      border:
        1px solid
        var(--border);

      border-bottom-left-radius: 6px;

      box-shadow:
        0 5px 20px
        rgba(0,0,0,0.08);
    }

    .message-meta {
      margin-top: 5px;

      color: var(--muted-2);

      font-size: 10px;
      line-height: 13px;
    }

    .user .message-meta {
      text-align: right;
    }

    /* =====================================================
       MARKDOWN
       ===================================================== */

    .bubble p {
      margin:
        0
        0
        10px;
    }

    .bubble p:last-child {
      margin-bottom: 0;
    }

    .bubble strong {
      color: white;
      font-weight: 700;
    }

    .bubble em {
      color: #d7d9e2;
    }

    .bubble h1,
    .bubble h2,
    .bubble h3 {
      margin:
        15px
        0
        8px;

      line-height: 1.3;
    }

    .bubble h1 {
      font-size: 21px;
    }

    .bubble h2 {
      font-size: 18px;
    }

    .bubble h3 {
      font-size: 16px;
    }

    .bubble ul,
    .bubble ol {
      margin:
        8px
        0
        10px;

      padding-left: 21px;
    }

    .bubble li {
      margin: 4px 0;
    }

    .bubble blockquote {
      margin:
        10px
        0;

      padding:
        8px
        12px;

      border-left:
        3px solid
        var(--accent);

      color: #c5c8d1;

      background:
        rgba(255,255,255,0.025);

      border-radius: 4px;
    }

    .inline-code {
      padding:
        2px
        5px;

      color: #d8e6ff;

      background:
        rgba(93,156,255,0.1);

      border-radius: 5px;

      font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size: 0.88em;
    }

    .code-block {
      margin:
        12px
        0;

      overflow: hidden;

      background: #080a0e;

      border:
        1px solid
        var(--border);

      border-radius: 11px;
    }

    .code-header {
      height: 34px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding:
        0
        10px;

      color: var(--muted);

      background:
        rgba(255,255,255,0.025);

      border-bottom:
        1px solid
        var(--border);

      font-size: 10px;
    }

    .copy-code {
      padding:
        5px
        8px;

      color: var(--muted);

      background: transparent;

      border-radius: 6px;

      font-size: 10px;

      cursor: pointer;
    }

    .copy-code:hover {
      color: var(--text);

      background:
        rgba(255,255,255,0.06);
    }

    .code-block pre {
      margin: 0;

      padding: 12px;

      overflow-x: auto;

      color: #e7e9ef;

      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;

      font-size: 12px;
      line-height: 1.55;

      tab-size: 2;
    }

    .bubble a {
      color: #86b8ff;
      text-decoration: underline;
      text-decoration-color:
        rgba(134,184,255,0.35);
    }

    /* =====================================================
       TYPING
       ===================================================== */

    .typing-bubble {
      display: inline-flex;

      align-items: center;

      gap: 5px;

      min-width: 57px;
      min-height: 39px;

      padding:
        11px
        14px;

      background:
        var(--assistant);

      border:
        1px solid
        var(--border);

      border-radius: 18px;

      border-bottom-left-radius: 6px;
    }

    .typing-dot {
      width: 5px;
      height: 5px;

      border-radius: 50%;

      background: #9298a7;

      animation:
        typing
        1.2s
        infinite
        ease-in-out;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typing {
      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: 0.45;
      }

      30% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    /* =====================================================
       STREAM CURSOR
       ===================================================== */

    .streaming-cursor {
      display: inline-block;

      width: 6px;
      height: 16px;

      margin-left: 3px;

      vertical-align: -3px;

      background:
        var(--accent);

      border-radius: 2px;

      animation:
        blink
        0.9s
        infinite;
    }

    @keyframes blink {
      0%,
      45% {
        opacity: 1;
      }

      46%,
      100% {
        opacity: 0;
      }
    }

    /* =====================================================
       COMPOSER
       ===================================================== */

    .composer-shell {
      flex: 0 0 auto;

      padding:
        8px
        12px
        calc(
          9px +
          env(safe-area-inset-bottom)
        );

      background:
        linear-gradient(
          to bottom,
          rgba(8,10,15,0),
          rgba(8,10,15,0.94) 18%
        );

      z-index: 15;
    }

    .composer {
      width: 100%;
      max-width: 820px;

      margin: 0 auto;

      display: flex;
      align-items: flex-end;

      gap: 8px;

      padding: 7px;

      background:
        rgba(18,22,30,0.96);

      border:
        1px solid
        var(--border-strong);

      border-radius: 19px;

      box-shadow:
        0 10px 40px
        rgba(0,0,0,0.28);

      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    .composer:focus-within {
      border-color:
        rgba(93,156,255,0.35);

      box-shadow:
        0 10px 40px
        rgba(0,0,0,0.32),

        0 0 0 3px
        rgba(93,156,255,0.05);
    }

    #input {
      flex: 1;

      width: 100%;
      min-width: 0;

      min-height: 39px;
      max-height: 150px;

      padding:
        10px
        8px;

      resize: none;

      color: var(--text);

      background: transparent;

      border: 0;
      outline: 0;

      font-size: 15px;
      line-height: 19px;

      overflow-y: auto;
    }

    #input::placeholder {
      color: var(--muted-2);
    }

    .send-button {
      width: 39px;
      height: 39px;

      flex: 0 0 39px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;

      background:
        var(--accent);

      border-radius: 13px;

      cursor: pointer;

      box-shadow:
        0 5px 16px
        var(--accent-glow);

      transition:
        transform 0.12s ease,
        opacity 0.15s ease;
    }

    .send-button:hover {
      transform: translateY(-1px);
    }

    .send-button:active {
      transform: scale(0.94);
    }

    .send-button:disabled {
      opacity: 0.4;

      cursor: default;

      box-shadow: none;
    }

    .send-button svg {
      width: 18px;
      height: 18px;
    }

    .stop-button {
      background:
        rgba(255,102,120,0.12);

      color:
        var(--danger);

      box-shadow: none;
    }

    .composer-hint {
      max-width: 820px;

      margin:
        6px
        auto
        0;

      text-align: center;

      color: var(--muted-2);

      font-size: 9px;
      line-height: 12px;
    }

    /* =====================================================
       TOAST
       ===================================================== */

    .toast-container {
      position: fixed;

      left: 50%;

      bottom:
        calc(
          90px +
          env(safe-area-inset-bottom)
        );

      transform:
        translateX(-50%);

      width: max-content;

      max-width:
        calc(100% - 28px);

      z-index: 100;

      pointer-events: none;
    }

    .toast {
      padding:
        9px
        13px;

      color: #f4f5f8;

      background:
        #1a1f29;

      border:
        1px solid
        var(--border-strong);

      border-radius: 10px;

      box-shadow:
        0 10px 40px
        rgba(0,0,0,0.28);

      font-size: 12px;

      animation:
        toast-in
        0.18s
        ease-out;
    }

    @keyframes toast-in {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 600px) {
      .chat {
        padding-left: 10px;
        padding-right: 10px;
      }

      .message-content {
        max-width: 91%;
      }

      .bubble {
        font-size: 15px;
        padding:
          11px
          13px;
      }

      .welcome {
        padding-top: 20px;
      }

      .welcome h1 {
        font-size: 23px;
      }

      .suggestions {
        padding:
          0
          8px;
      }

      .suggestion {
        font-size: 11px;
      }

      .composer-shell {
        padding-left: 8px;
        padding-right: 8px;
      }
    }

    /* =====================================================
       REDUCED MOTION
       ===================================================== */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- ===================================================
       HEADER
       =================================================== -->

  <header class="header">

    <div class="header-left">

      <div
        class="avatar"
        aria-hidden="true"
      >
        G
      </div>

      <div class="identity">

        <div class="name-row">

          <div class="name">
            Gock
          </div>

          <div
            id="statusDot"
            class="status-dot"
            aria-hidden="true"
          ></div>

        </div>

        <div
          id="statusText"
          class="status"
          aria-live="polite"
        >
          Connecting…
        </div>

      </div>

    </div>


    <div class="header-actions">

      <button
        id="resetButton"
        class="icon-button"
        type="button"
        aria-label="Start a new conversation"
        title="New conversation"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M3 12a9 9 0 0 0 15.3 6.4L21 16"
          />

          <path
            d="M21 12a9 9 0 0 0-15.3-6.4L3 8"
          />

          <path d="M21 16h-5" />
          <path d="M3 8h5" />
        </svg>

      </button>

    </div>

  </header>


  <!-- ===================================================
       CHAT
       =================================================== -->

  <main
    id="chat"
    class="chat"
    aria-live="polite"
    aria-label="Conversation with Gock"
  >

    <div
      id="conversation"
      class="conversation"
    >

      <section
        id="welcome"
        class="welcome"
      >

        <div
          class="welcome-avatar"
          aria-hidden="true"
        >
          G
        </div>

        <h1>
          Hi, I'm Gock.
        </h1>

        <p>
          Your engineering and technology assistant.
          We can build, debug, research, reason, and turn
          ideas into real projects.
        </p>


        <div class="suggestions">

          <button
            class="suggestion"
            type="button"
            data-prompt="Help me design a software project from scratch."
          >
            Build a project
          </button>

          <button
            class="suggestion"
            type="button"
            data-prompt="Help me debug this code step by step."
          >
            Debug code
          </button>

          <button
            class="suggestion"
            type="button"
            data-prompt="Help me understand blockchain architecture."
          >
            Explore blockchain
          </button>

          <button
            class="suggestion"
            type="button"
            data-prompt="Help me research an AI technology."
          >
            Research AI
          </button>

        </div>

      </section>

    </div>

  </main>


  <!-- ===================================================
       COMPOSER
       =================================================== -->

  <section class="composer-shell">

    <form
      id="composerForm"
      class="composer"
      autocomplete="off"
    >

      <textarea
        id="input"
        rows="1"
        maxlength="12000"
        placeholder="Message Gock…"
        aria-label="Message Gock"
      ></textarea>


      <button
        id="sendButton"
        class="send-button"
        type="submit"
        aria-label="Send message"
        title="Send"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M22 2 11 13" />
          <path
            d="m22 2-7 20-4-9-9-4Z"
          />
        </svg>

      </button>

    </form>


    <div class="composer-hint">
      Enter to send · Shift + Enter for a new line
    </div>

  </section>

</div>


<div
  id="toastContainer"
  class="toast-container"
  aria-live="assertive"
></div>


<script>
  /* ═══════════════════════════════════════════════
     GOCK FRONTEND V2
     ═══════════════════════════════════════════════ */

  const STORAGE_KEY =
    "gock_conversation_v2";

  const MAX_MESSAGES = 40;


  const state = {
    messages: [],

    streaming: false,

    controller: null,

    currentAssistantMessage: null,

    currentAssistantBubble: null,

    currentRawText: "",

    requestStartedAt: 0
  };


  /* =================================================
     DOM
     ================================================= */

  const chat =
    document.getElementById("chat");

  const conversation =
    document.getElementById("conversation");

  const welcome =
    document.getElementById("welcome");

  const form =
    document.getElementById("composerForm");

  const input =
    document.getElementById("input");

  const sendButton =
    document.getElementById("sendButton");

  const resetButton =
    document.getElementById("resetButton");

  const statusDot =
    document.getElementById("statusDot");

  const statusText =
    document.getElementById("statusText");

  const toastContainer =
    document.getElementById("toastContainer");


  /* =================================================
     ESCAPE HTML
     ================================================= */

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  /* =================================================
     TOAST
     ================================================= */

  function showToast(message) {
    const toast =
      document.createElement("div");

    toast.className = "toast";

    toast.textContent = message;

    toastContainer.replaceChildren(toast);

    setTimeout(() => {
      if (toast.isConnected) {
        toast.remove();
      }
    }, 3200);
  }


  /* =================================================
     TIME
     ================================================= */

  function nowTime() {
    return new Intl.DateTimeFormat(
      undefined,
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    ).format(new Date());
  }


  /* =================================================
     SCROLL
     ================================================= */

  function scrollToBottom(force = false) {

    if (force) {
      chat.scrollTop =
        chat.scrollHeight;

      return;
    }


    const distance =
      chat.scrollHeight -
      chat.scrollTop -
      chat.clientHeight;


    if (distance < 260) {
      chat.scrollTop =
        chat.scrollHeight;
    }
  }


  /* =================================================
     LOCAL STORAGE
     ================================================= */

  function saveMessages() {

    try {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
          state.messages
            .slice(-MAX_MESSAGES)
        )
      );

    } catch (error) {

      console.warn(
        "Could not save conversation:",
        error
      );

    }
  }


  function loadMessages() {

    try {

      const raw =
        localStorage.getItem(
          STORAGE_KEY
        );

      if (!raw) {
        return [];
      }


      const parsed =
        JSON.parse(raw);


      if (!Array.isArray(parsed)) {
        return [];
      }


      return parsed
        .filter(
          message =>
            message &&
            (
              message.role === "user" ||
              message.role === "assistant"
            ) &&
            typeof message.content ===
              "string"
        )
        .slice(-MAX_MESSAGES);

    } catch (error) {

      console.warn(
        "Could not load conversation:",
        error
      );

      return [];
    }
  }


  /* =================================================
     MARKDOWN INLINE
     ================================================= */

  function renderInline(text) {

    let output =
      escapeHtml(text);


    const codeTokens = [];


    output =
      output.replace(
        /`([^`]+)`/g,
        (_, code) => {

          const token =
            `@@CODE${codeTokens.length}@@`;

          codeTokens.push(
            `<code class="inline-code">${code}</code>`
          );

          return token;
        }
      );


    output =
      output.replace(
        /\*\*(.+?)\*\*/g,
        "<strong>$1</strong>"
      );


    output =
      output.replace(
        /__(.+?)__/g,
        "<strong>$1</strong>"
      );


    output =
      output.replace(
        /\*([^*\n]+)\*/g,
        "<em>$1</em>"
      );


    output =
      output.replace(
        /_([^_\n]+)_/g,
        "<em>$1</em>"
      );


    output =
      output.replace(
        /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
      );


    for (
      let i = 0;
      i < codeTokens.length;
      i++
    ) {

      output =
        output.replace(
          `@@CODE${i}@@`,
          codeTokens[i]
        );

    }


    return output;
  }


  /* =================================================
     MARKDOWN
     ================================================= */

  function renderMarkdown(markdown) {

    if (!markdown) {
      return "";
    }


    const normalized =
      String(markdown)
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n");


    const lines =
      normalized.split("\n");


    let html = "";

    let paragraph = [];

    let listType = null;

    let code = null;


    function flushParagraph() {

      if (!paragraph.length) {
        return;
      }


      html +=
        "<p>" +
        paragraph
          .map(
            line =>
              renderInline(line)
          )
          .join("<br>") +
        "</p>";


      paragraph = [];
    }


    function closeList() {

      if (!listType) {
        return;
      }


      html +=
        `</${listType}>`;

      listType = null;
    }


    function closeCode() {

      if (!code) {
        return;
      }


      const language =
        code.language ||
        "code";


      const encoded =
        escapeHtml(
          code.lines.join("\n")
        );


      html += `
        <div class="code-block">

          <div class="code-header">

            <span>
              ${escapeHtml(language)}
            </span>

            <button
              class="copy-code"
              type="button"
              data-code="${encoded}"
            >
              Copy
            </button>

          </div>

          <pre><code>${encoded}</code></pre>

        </div>
      `;


      code = null;
    }


    for (
      let i = 0;
      i < lines.length;
      i++
    ) {

      const line =
        lines[i];


      /* CODE FENCE */

      const fence =
        line.match(
          /^```(.*)$/
        );


      if (fence) {

        flushParagraph();
        closeList();


        if (!code) {

          code = {
            language:
              fence[1].trim() ||
              "code",

            lines: []
          };

        } else {

          closeCode();

        }


        continue;
      }


      if (code) {

        code.lines.push(line);

        continue;
      }


      /* BLANK */

      if (!line.trim()) {

        flushParagraph();
        closeList();

        continue;
      }


      /* HEADINGS */

      const heading =
        line.match(
          /^(#{1,3})\s+(.+)$/
        );


      if (heading) {

        flushParagraph();
        closeList();


        const level =
          heading[1].length;


        html +=
          `<h${level}>` +
          renderInline(
            heading[2]
          ) +
          `</h${level}>`;


        continue;
      }


      /* BLOCKQUOTE */

      if (/^>\s?/.test(line)) {

        flushParagraph();
        closeList();


        const quote =
          line.replace(
            /^>\s?/,
            ""
          );


        html +=
          `<blockquote>${renderInline(
            quote
          )}</blockquote>`;


        continue;
      }


      /* UNORDERED LIST */

      const unordered =
        line.match(
          /^\s*[-*+]\s+(.+)$/
        );


      if (unordered) {

        flushParagraph();


        if (listType !== "ul") {

          closeList();

          html += "<ul>";

          listType = "ul";
        }


        html +=
          `<li>${renderInline(
            unordered[1]
          )}</li>`;


        continue;
      }


      /* ORDERED LIST */

      const ordered =
        line.match(
          /^\s*\d+\.\s+(.+)$/
        );


      if (ordered) {

        flushParagraph();


        if (listType !== "ol") {

          closeList();

          html += "<ol>";

          listType = "ol";
        }


        html +=
          `<li>${renderInline(
            ordered[1]
          )}</li>`;


        continue;
      }


      /* NORMAL */

      if (listType) {
        closeList();
      }


      paragraph.push(line);
    }


    flushParagraph();

    closeList();

    closeCode();


    return html;
  }


  /* =================================================
     CREATE MESSAGE
     ================================================= */

  function createMessageElement(
    role,
    content,
    streaming = false
  ) {

    const wrapper =
      document.createElement("article");


    wrapper.className =
      `message ${role}`;


    const contentWrapper =
      document.createElement("div");


    contentWrapper.className =
      "message-content";


    const bubble =
      document.createElement("div");


    bubble.className =
      "bubble";


    bubble.innerHTML =
      role === "assistant"
        ? renderMarkdown(content)
        : escapeHtml(content)
            .replace(/\n/g, "<br>");


    if (streaming) {

      bubble.innerHTML +=
        '<span class="streaming-cursor"></span>';
    }


    const meta =
      document.createElement("div");


    meta.className =
      "message-meta";


    meta.textContent =
      role === "user"
        ? `You · ${nowTime()}`
        : `Gock · ${nowTime()}`;


    contentWrapper.appendChild(
      bubble
    );

    contentWrapper.appendChild(
      meta
    );


    wrapper.appendChild(
      contentWrapper
    );


    return {
      wrapper,
      bubble,
      meta
    };
  }


  /* =================================================
     APPEND MESSAGE
     ================================================= */

  function appendMessage(
    role,
    content,
    options = {}
  ) {

    const element =
      createMessageElement(
        role,
        content,
        Boolean(options.streaming)
      );


    conversation.appendChild(
      element.wrapper
    );


    if (welcome) {
      welcome.style.display = "none";
    }


    if (!options.skipScroll) {
      scrollToBottom(true);
    }


    return element;
  }


  /* =================================================
     REBUILD
     ================================================= */

  function rebuildConversation() {

    conversation.replaceChildren();

    conversation.appendChild(
      welcome
    );


    welcome.style.display =
      state.messages.length
        ? "none"
        : "";


    for (
      const message of state.messages
    ) {

      appendMessage(
        message.role,
        message.content,
        {
          skipScroll: true
        }
      );

    }


    requestAnimationFrame(
      () => {
        scrollToBottom(true);
      }
    );
  }


  /* =================================================
     COPY CODE
     ================================================= */

  document.addEventListener(
    "click",
    async event => {

      const button =
        event.target.closest(
          ".copy-code"
        );


      if (!button) {
        return;
      }


      const encoded =
        button.getAttribute(
          "data-code"
        ) || "";


      const temporary =
        document.createElement(
          "textarea"
        );


      temporary.innerHTML =
        encoded;


      const code =
        temporary.value;


      try {

        await navigator.clipboard
          .writeText(code);


        button.textContent =
          "Copied";


        setTimeout(
          () => {

            if (button.isConnected) {
              button.textContent =
                "Copy";
            }

          },
          1200
        );

      } catch {

        showToast(
          "Could not copy code."
        );
      }

    }
  );

     INPUT SIZE
     ================================================= */

  function resizeInput() {

    input.style.height =
      "auto";


    const height =
      Math.min(
        input.scrollHeight,
        150
      );


    input.style.height =
      Math.max(
        39,
        height
      ) + "px";

  input.addEventListener(
    "input",
    resizeInput
  );

  /* =================================================
     HEALTH
     ================================================= */

  async function checkHealth() {

    try {

      const response =
        await fetch(
          "/health",
          {
            method: "GET",
            cache: "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          `Health check failed: ${response.status}`
        );
      }


      const data =
        await response.json();


      if (data && data.ok) {

        setStatus(
          "online",
          "Online"
        );

      } else {

        setStatus(
          "error",
          "Service unavailable"
        );

      }

    } catch (error) {

      console.warn(error);


      setStatus(
        "error",
        "Offline"
      );
    }
  }


  /* =================================================
     SSE CONSUMER
     ================================================= */

  async function consumeSSE(
    response,
    onEvent
  ) {

    if (!response.body) {

      throw new Error(
        "Streaming response body is unavailable."
      );
    }


    const reader =
      response.body.getReader();


    const decoder =
      new TextDecoder(
        "utf-8"
      );


    let buffer = "";


    while (true) {

      const {
        value,
        done
      } = await reader.read();


      if (done) {
        break;
      }


      buffer +=
        decoder.decode(
          value,
          {
            stream: true
          }
        );


      /*
       * Canonical SSE normalization.
       *
       * Handles:
       * LF
       * CRLF
       * CR
       *
       * and arbitrary network chunk
       * fragmentation.
       */

      buffer =
        buffer
          .replace(
            /\r\n/g,
            "\n"
          )
          .replace(
            /\r/g,
            "\n"
          );


      let separator;


      while (
        (
          separator =
            buffer.indexOf("\n\n")
        ) !== -1
      ) {

        const rawEvent =
          buffer.slice(
            0,
            separator
          );


        buffer =
          buffer.slice(
            separator + 2
          );


        processSSEEvent(
          rawEvent,
          onEvent
        );
      }
    }


    /*
     * Process any final complete event.
     */

    if (buffer.trim()) {

      processSSEEvent(
        buffer,
        onEvent
      );
    }
  }


  /* =================================================
     PROCESS SSE EVENT
     ================================================= */

  function processSSEEvent(
    rawEvent,
    onEvent
  ) {

    if (!rawEvent.trim()) {
      return;
    }


    const lines =
      rawEvent.split("\n");


    const dataLines = [];


    for (
      const line of lines
    ) {

      if (
        line.startsWith("data:")
      ) {

        dataLines.push(
          line.slice(5)
            .trimStart()
        );

      }

    }


    if (!dataLines.length) {
      return;
    }


    const rawData =
      dataLines.join("\n");


    if (
      rawData === "[DONE]"
    ) {

      onEvent({
        type: "done"
      });

      return;
    }


    let data;


    try {

      data =
        JSON.parse(
          rawData
        );

    } catch {

      return;
    }


    onEvent(data);
  }


  /* =================================================
     EXTRACT STREAM TEXT
     ================================================= */

  function extractTextFromEvent(
    event
  ) {

    if (!event) {
      return "";
    }


    /*
     * Direct server text event.
     */

    if (
      event.type === "text" &&
      typeof event.text ===
        "string"
    ) {

      return event.text;
    }


    /*
     * Gemini Interactions API:
     *
     * step.delta
     * {
     *   delta: {
     *     type: "text",
     *     text: "..."
     *   }
     * }
     */

    if (
      event.type ===
        "step.delta" &&
      event.delta &&
      event.delta.type ===
        "text" &&
      typeof event.delta.text ===
        "string"
    ) {

      return event.delta.text;
    }


    /*
     * Compatible nested shape.
     */

    if (
      event.delta &&
      typeof event.delta.text ===
        "string"
    ) {

      return event.delta.text;
    }


    if (
      event.data &&
      typeof event.data.text ===
        "string"
    ) {

      return event.data.text;
    }


    return "";
  }


  /* =================================================
     ERROR EXTRACTION
     ================================================= */

  async function extractResponseError(
    response
  ) {

    let message =
      `Request failed (${response.status})`;


    try {

      const text =
        await response.text();


      if (text) {

        try {

          const json =
            JSON.parse(text);


          message =
            json.error ||
            json.message ||
            message;

        } catch {

          message =
            text.slice(
              0,
              500
            );
        }
      }

    } catch {

      // Keep default message.

    }


    return message;
  }


  /* =================================================
     START ASSISTANT STREAM
     ================================================= */

  function startAssistantStream() {

    const element =
      appendMessage(
        "assistant",
        "",
        {
          streaming: true
        }
      );


    state.currentAssistantMessage =
      element.wrapper;


    state.currentAssistantBubble =
      element.bubble;


    state.currentRawText =
      "";


    return element;
  }


  /* =================================================
     UPDATE ASSISTANT
     ================================================= */

  function updateAssistantStream(
    text
  ) {

    state.currentRawText +=
      text;


    if (
      !state.currentAssistantBubble
    ) {
      return;
    }


    state.currentAssistantBubble.innerHTML =
      renderMarkdown(
        state.currentRawText
      ) +
      '<span class="streaming-cursor"></span>';


    scrollToBottom(false);
  }


  /* =================================================
     FINISH ASSISTANT
     ================================================= */

  function finishAssistantStream() {

    if (
      !state.currentAssistantBubble
    ) {
      return;
    }


    state.currentAssistantBubble.innerHTML =
      renderMarkdown(
        state.currentRawText
      );


    const meta =
      state.currentAssistantMessage
        ?.querySelector(
          ".message-meta"
        );


    if (meta) {

      meta.textContent =
        `Gock · ${nowTime()}`;
    }


    state.currentAssistantMessage =
      null;


    state.currentAssistantBubble =
      null;
  }


  /* =================================================
     REQUEST HISTORY
     ================================================= */

  function buildRequestMessages() {

    return state.messages
      .slice(-20)
      .map(
        message => ({
          role:
            message.role,

          content:
            message.content
        })
      );
  }


  /* =================================================
     SEND
     ================================================= */

  async function sendMessage(
    text
  ) {

    const clean =
      String(text || "")
        .trim();


    if (
      !clean ||
      state.streaming
    ) {
      return;
    }


    /*
     * Save user message first.
     */

    state.messages.push({
      role: "user",
      content: clean
    });


    state.messages =
      state.messages
        .slice(-MAX_MESSAGES);


    saveMessages();


    appendMessage(
      "user",
      clean
    );


    input.value = "";

    resizeInput();


    setSending(true);


    state.requestStartedAt =
      Date.now();


    startAssistantStream();


    state.controller =
      new AbortController();


    try {

      const response =
        await fetch(
          "/api/message/stream",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json",

              "Accept":
                "text/event-stream"
            },

            credentials:
              "include",

            body:
              JSON.stringify({
                message: clean,

                history:
                  buildRequestMessages()
              }),

            signal:
              state.controller.signal
          }
        );


      if (!response.ok) {

        const error =
          await extractResponseError(
            response
          );


        throw new Error(
          error
        );
      }


      let receivedText =
        false;


      await consumeSSE(
        response,
        event => {

          const text =
            extractTextFromEvent(
              event
            );


          if (text) {

            receivedText =
              true;


            updateAssistantStream(
              text
            );
          }


          /*
           * Explicit server errors.
           */

          if (
            event.type ===
              "error" ||
            event.error
          ) {

            const message =
              typeof event.error ===
                "string"

                ? event.error

                : event.error?.message ||
                  "Gock encountered an error.";


            throw new Error(
              message
            );
          }

        }
      );


      /*
       * Never silently accept an
       * empty response.
       */

      if (!receivedText) {

        throw new Error(
          "Gock returned an empty response."
        );
      }


      finishAssistantStream();


      state.messages.push({
        role: "assistant",

        content:
          state.currentRawText
      });


      state.messages =
        state.messages
          .slice(-MAX_MESSAGES);


      saveMessages();


      setStatus(
        "online",
        "Online"
      );


    } catch (error) {

      /*
       * User pressed STOP.
       */

      if (
        error?.name ===
          "AbortError"
      ) {

        if (
          state.currentRawText
            .trim()
        ) {

          finishAssistantStream();


          state.messages.push({
            role:
              "assistant",

            content:
              state.currentRawText
          });


          state.messages =
            state.messages
              .slice(-MAX_MESSAGES);


          saveMessages();

        } else {

          state.currentAssistantMessage
            ?.remove();
        }


        return;
      }


      console.error(
        "Gock request error:",
        error
      );


      /*
       * Preserve useful partial
       * generation.
       */

      if (
        state.currentRawText
          .trim()
      ) {

        finishAssistantStream();


        state.messages.push({
          role:
            "assistant",

          content:
            state.currentRawText
        });


        state.messages =
          state.messages
            .slice(-MAX_MESSAGES);


        saveMessages();


        showToast(
          "Gock's response was interrupted."
        );

      } else {

        state.currentAssistantMessage
          ?.remove();


        showToast(
          error?.message ||
          "Gock could not respond."
        );
      }


      setStatus(
        "error",
        "Connection problem"
      );

    } finally {

      state.controller =
        null;

      setSending(false);
    }
  }


  /* =================================================
     STOP
     ================================================= */

  function stopGeneration() {

    if (
      state.controller &&
      state.streaming
    ) {

      state.controller.abort();
    }
  }


  sendButton.addEventListener(
    "click",
    event => {

      if (state.streaming) {

        event.preventDefault();

        stopGeneration();
      }
    }
  );


  /* =================================================
     FORM
     ================================================= */

  form.addEventListener(
    "submit",
    event => {

      event.preventDefault();


      if (state.streaming) {

        stopGeneration();

        return;
      }


      sendMessage(
        input.value
      );
    }
  );

     SUGGESTIONS
     ================================================= */

  document.addEventListener(
    "click",
    event => {

      const button =
        event.target.closest(
          "[data-prompt]"
        );


      if (!button) {
        return;
      }


      const prompt =
        button.getAttribute(
          "data-prompt"
        );


      if (!prompt) {
        return;
      }


      input.value =
        prompt;


      resizeInput();


      input.focus();
    }
  );


  /* =================================================
     RESET
     ================================================= */

  async function resetConversation() {

    if (state.streaming) {
      stopGeneration();
    }


    state.messages = [];


    saveMessages();


    rebuildConversation();


    try {

      const response =
        await fetch(
          "/api/conversation/reset",
          {
            method: "POST",
            credentials: "include"
          }
        );


      if (!response.ok) {

        throw new Error(
          "Server reset failed."
        );
      }


      showToast(
        "New conversation started."
      );

    } catch (error) {

      console.warn(
        "Server reset failed:",
        error
      );


      showToast(
        "New local conversation started."
      );
    }


    input.focus();
  }


  resetButton.addEventListener(
    "click",
    resetConversation
  );


  /* =================================================
     MOBILE KEYBOARD
     ================================================= */

  input.addEventListener(
    "focus",
    () => {

      setTimeout(
        () => {
          scrollToBottom(true);
        },
        250
      );

    }
  );


  /* =================================================
     VISIBILITY
     ================================================= */

  document.addEventListener(
    "visibilitychange",
    () => {

      if (
        document.visibilityState ===
          "visible"
      ) {

        checkHealth();
      }

    }
  );


  /* =================================================
     NETWORK
     ================================================= */

  window.addEventListener(
    "online",
    () => {

      checkHealth();

      setStatus(
        "online",
        "Online"
      );
    }
  );


  window.addEventListener(
    "offline",
    () => {

      setStatus(
        "error",
        "Offline"
      );
    }
  );


  /* =================================================
     INITIALIZATION
     ================================================= */

  function initialize() {

    state.messages =
      loadMessages();


    rebuildConversation();


    resizeInput();


    checkHealth();


    input.focus();
  }


  initialize();


  /*
   * Lightweight health refresh.
   *
   * This does NOT intentionally keep
   * Render awake.
   */

  window.setInterval(
    checkHealth,
    60000
  );

</script>

</body>
</html>
