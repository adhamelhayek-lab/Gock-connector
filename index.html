<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta
    name="theme-color"
    content="#0b0b0b"
  />

  <meta
    name="description"
    content="Huda — your personal AI assistant and English teacher."
  />

  <title>Huda</title>

  <style>
    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0b0b0b;
      color: #f5f5f5;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    body {
      overflow: hidden;
    }

    button,
    textarea {
      font: inherit;
    }

    /* =========================================================
       APP
    ========================================================= */

    #app {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: #0b0b0b;
      overflow: hidden;
    }

    /* =========================================================
       HEADER
    ========================================================= */

    .header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 14px;

      min-height: 116px;
      padding:
        calc(env(safe-area-inset-top) + 18px)
        22px
        18px;

      background: #0d0d0d;
      border-bottom: 1px solid #292929;
      z-index: 10;
    }

    .avatar {
      width: 64px;
      height: 64px;
      flex: 0 0 64px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #f5f5f5;
      color: #111;

      font-size: 30px;
      font-weight: 700;

      user-select: none;
    }

    .header-info {
      min-width: 0;
    }

    .header-title {
      margin: 0;

      font-size: 30px;
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: -0.6px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;

      margin-top: 7px;

      color: #929292;
      font-size: 17px;
      line-height: 1.2;
    }

    .status-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #25d977;

      box-shadow: 0 0 12px rgba(37, 217, 119, 0.55);
    }

    /* =========================================================
       CHAT AREA
    ========================================================= */

    #chat {
      flex: 1 1 auto;

      width: 100%;
      max-width: 900px;

      margin: 0 auto;
      padding: 26px 22px 180px;

      overflow-y: auto;
      overflow-x: hidden;

      scroll-behavior: smooth;

      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;

      scrollbar-width: thin;
      scrollbar-color: #3b3b3b transparent;
    }

    #chat::-webkit-scrollbar {
      width: 6px;
    }

    #chat::-webkit-scrollbar-track {
      background: transparent;
    }

    #chat::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 20px;
    }

    /* =========================================================
       WELCOME
    ========================================================= */

    .welcome {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;

      padding: 40px 10px 80px;
    }

    .welcome-content {
      width: 100%;
      max-width: 650px;
      text-align: center;
    }

    .welcome-avatar {
      width: 88px;
      height: 88px;

      margin: 0 auto 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #f5f5f5;
      color: #111;

      font-size: 42px;
      font-weight: 700;
    }

    .welcome h1 {
      margin: 0;

      font-size: 38px;
      line-height: 1.1;
      letter-spacing: -1px;
    }

    .welcome p {
      margin: 14px auto 0;

      max-width: 540px;

      color: #999;
      font-size: 18px;
      line-height: 1.55;
    }

    /* =========================================================
       MESSAGES
    ========================================================= */

    .message-row {
      width: 100%;
      display: flex;
      margin: 0 0 18px;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.assistant {
      justify-content: flex-start;
    }

    .message {
      max-width: min(78%, 650px);

      padding: 15px 18px;

      border-radius: 24px;

      font-size: 19px;
      line-height: 1.55;

      word-wrap: break-word;
      overflow-wrap: anywhere;

      animation: messageIn 0.18s ease-out;
    }

    .message.user {
      background: #303030;
      color: #f4f4f4;

      border-bottom-right-radius: 8px;
    }

    .message.assistant {
      background: #202020;
      color: #f1f1f1;

      border: 1px solid #303030;

      border-bottom-left-radius: 8px;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================================================
       MARKDOWN
    ========================================================= */

    .message p {
      margin: 0 0 12px;
    }

    .message p:last-child {
      margin-bottom: 0;
    }

    .message strong {
      font-weight: 700;
    }

    .message em {
      font-style: italic;
    }

    .message h1,
    .message h2,
    .message h3 {
      margin: 18px 0 10px;
      line-height: 1.25;
    }

    .message h1 {
      font-size: 27px;
    }

    .message h2 {
      font-size: 24px;
    }

    .message h3 {
      font-size: 21px;
    }

    .message ul,
    .message ol {
      margin: 8px 0 12px;
      padding-left: 24px;
    }

    .message li {
      margin: 5px 0;
    }

    .message code {
      padding: 2px 6px;
      border-radius: 6px;
      background: #111;
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;
      font-size: 0.88em;
    }

    .message pre {
      margin: 12px 0;
      padding: 14px;

      overflow-x: auto;

      border-radius: 12px;
      background: #111;

      border: 1px solid #333;
    }

    .message pre code {
      padding: 0;
      background: transparent;
      font-size: 14px;
    }

    .message blockquote {
      margin: 12px 0;
      padding-left: 14px;

      border-left: 3px solid #666;

      color: #bdbdbd;
    }

    .message a {
      color: #ddd;
      text-decoration: underline;
    }

    /* =========================================================
       TYPING INDICATOR
    ========================================================= */

    .typing-row {
      display: flex;
      justify-content: flex-start;

      margin: 0 0 18px;
    }

    .typing {
      display: flex;
      align-items: center;
      gap: 7px;

      padding: 14px 19px;

      border-radius: 22px;
      border-bottom-left-radius: 8px;

      background: #202020;
      border: 1px solid #303030;
    }

    .typing span {
      width: 8px;
      height: 8px;

      border-radius: 50%;
      background: #aaa;

      animation: typing 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typing {
      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: 0.45;
      }

      30% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    /* =========================================================
       ERROR
    ========================================================= */

    .error-message {
      background: #211d1d !important;
      border-color: #694444 !important;
      color: #f2b0b0 !important;
    }

    /* =========================================================
       COMPOSER
    ========================================================= */

    .composer-wrap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;

      padding:
        16px
        16px
        calc(env(safe-area-inset-bottom) + 16px);

      background:
        linear-gradient(
          to top,
          #0b0b0b 65%,
          rgba(11, 11, 11, 0)
        );

      z-index: 20;
      pointer-events: none;
    }

    .composer {
      pointer-events: auto;

      width: 100%;
      max-width: 900px;

      margin: 0 auto;

      min-height: 118px;

      display: flex;
      align-items: flex-end;
      gap: 10px;

      padding: 14px;

      background: #171717;

      border: 1px solid #393939;
      border-radius: 28px;

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.35);
    }

    #messageInput {
      flex: 1 1 auto;

      width: 100%;
      min-width: 0;

      min-height: 70px;
      max-height: 180px;

      resize: none;

      border: 0;
      outline: none;

      background: transparent;
      color: #f5f5f5;

      padding: 12px 10px;

      font-size: 20px;
      line-height: 1.4;

      overflow-y: auto;
    }

    #messageInput::placeholder {
      color: #737373;
      opacity: 1;
    }

    #sendButton {
      flex: 0 0 auto;

      min-width: 140px;
      height: 70px;

      border: 0;
      border-radius: 24px;

      background: #f5f5f5;
      color: #111;

      font-size: 20px;
      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.12s ease,
        opacity 0.12s ease,
        background 0.12s ease;
    }

    #sendButton:active {
      transform: scale(0.97);
    }

    #sendButton:disabled {
      cursor: default;
      opacity: 0.55;
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 600px) {
      .header {
        min-height: 116px;
        padding-left: 24px;
        padding-right: 24px;
      }

      .avatar {
        width: 62px;
        height: 62px;
        flex-basis: 62px;
        font-size: 29px;
      }

      .header-title {
        font-size: 29px;
      }

      .status {
        font-size: 17px;
      }

      #chat {
        padding:
          24px
          22px
          190px;
      }

      .message {
        max-width: 88%;
        font-size: 18px;
        padding: 15px 18px;
      }

      .composer-wrap {
        padding:
          12px
          16px
          calc(env(safe-area-inset-bottom) + 14px);
      }

      .composer {
        min-height: 112px;
        border-radius: 27px;
        padding: 13px;
      }

      #messageInput {
        min-height: 68px;
        font-size: 19px;
      }

      #sendButton {
        min-width: 128px;
        height: 68px;
        font-size: 19px;
        border-radius: 23px;
      }

      .welcome h1 {
        font-size: 34px;
      }

      .welcome p {
        font-size: 17px;
      }
    }

    /* =========================================================
       SMALL PHONES
    ========================================================= */

    @media (max-width: 390px) {
      .header {
        padding-left: 18px;
        padding-right: 18px;
      }

      #chat {
        padding-left: 16px;
        padding-right: 16px;
      }

      .message {
        max-width: 92%;
        font-size: 17px;
      }

      .composer {
        gap: 7px;
      }

      #sendButton {
        min-width: 112px;
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <div id="app">

    <!-- =======================================================
         HEADER
    ======================================================== -->

    <header class="header">

      <div class="avatar" aria-hidden="true">
        H
      </div>

      <div class="header-info">
        <h1 class="header-title">
          Huda
        </h1>

        <div class="status">
          <span class="status-dot"></span>
          <span>AI assistant</span>
        </div>
      </div>

    </header>


    <!-- =======================================================
         CHAT
    ======================================================== -->

    <main
      id="chat"
      aria-live="polite"
      aria-label="Huda conversation"
    >

      <section
        id="welcome"
        class="welcome"
      >

        <div class="welcome-content">

          <div
            class="welcome-avatar"
            aria-hidden="true"
          >
            H
          </div>

          <h1>
            Hi, I'm Huda.
          </h1>

          <p>
            Your personal AI assistant and English teacher.
            Ask me anything, practice English with me,
            or just start a conversation.
          </p>

        </div>

      </section>

    </main>


    <!-- =======================================================
         COMPOSER
    ======================================================== -->

    <div class="composer-wrap">

      <form
        id="composer"
        class="composer"
        autocomplete="off"
      >

        <textarea
          id="messageInput"
          name="message"
          rows="1"
          maxlength="12000"
          placeholder="Talk to Huda..."
          aria-label="Message Huda"
          enterkeyhint="send"
          spellcheck="true"
        ></textarea>

        <button
          id="sendButton"
          type="submit"
        >
          Send
        </button>

      </form>

    </div>

  </div>


  <script>
    /* =========================================================
       HUDA CHAT CLIENT
    ========================================================= */

    "use strict";


    /* =========================================================
       CONFIGURATION
    ========================================================= */

    const API_URL = "/api/message";

    const MAX_HISTORY = 40;

    let conversation = [];

    let sending = false;


    /* =========================================================
       ELEMENTS
    ========================================================= */

    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");

    const composer = document.getElementById("composer");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");


    /* =========================================================
       STORAGE
    ========================================================= */

    const STORAGE_KEY = "huda_conversation_v1";


    function loadConversation() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (!saved) {
          return;
        }

        const parsed = JSON.parse(saved);

        if (!Array.isArray(parsed)) {
          return;
        }

        conversation = parsed
          .filter(item =>
            item &&
            (item.role === "user" || item.role === "assistant") &&
            typeof item.content === "string"
          )
          .slice(-MAX_HISTORY);

      } catch (error) {
        console.warn("Could not load Huda conversation:", error);
        conversation = [];
      }
    }


    function saveConversation() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(
            conversation.slice(-MAX_HISTORY)
          )
        );
      } catch (error) {
        console.warn("Could not save Huda conversation:", error);
      }
    }


    /* =========================================================
       HTML ESCAPING
    ========================================================= */

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* =========================================================
       BASIC MARKDOWN
    ========================================================= */

    function renderMarkdown(text) {

      let html = escapeHtml(text);

      /* Code blocks */
      const codeBlocks = [];

      html = html.replace(
        /```([\s\S]*?)```/g,
        function (_, code) {
          const index = codeBlocks.length;

          codeBlocks.push(
            "<pre><code>" +
            code.trim() +
            "</code></pre>"
          );

          return `@@CODEBLOCK_${index}@@`;
        }
      );


      /* Inline code */

      html = html.replace(
        /`([^`]+)`/g,
        "<code>$1</code>"
      );


      /* Bold */

      html = html.replace(
        /\*\*(.+?)\*\*/g,
        "<strong>$1</strong>"
      );


      /* Italic */

      html = html.replace(
        /(^|[^*])\*([^*\n]+)\*(?!\*)/g,
        "$1<em>$2</em>"
      );


      /* Headings */

      html = html.replace(
        /^### (.+)$/gm,
        "<h3>$1</h3>"
      );

      html = html.replace(
        /^## (.+)$/gm,
        "<h2>$1</h2>"
      );

      html = html.replace(
        /^# (.+)$/gm,
        "<h1>$1</h1>"
      );


      /* Blockquotes */

      html = html.replace(
        /^&gt; (.+)$/gm,
        "<blockquote>$1</blockquote>"
      );


      /* Unordered lists */

      html = html.replace(
        /(?:^|\n)(?:[-*] .+(?:\n|$))+/g,
        function (block) {

          const items = block
            .trim()
            .split("\n")
            .map(line =>
              line.replace(/^[-*]\s+/, "")
            )
            .filter(Boolean);

          if (!items.length) {
            return block;
          }

          return (
            "<ul>" +
            items
              .map(item => `<li>${item}</li>`)
              .join("") +
            "</ul>"
          );
        }
      );


      /* Ordered lists */

      html = html.replace(
        /(?:^|\n)(?:\d+\. .+(?:\n|$))+/g,
        function (block) {

          const items = block
            .trim()
            .split("\n")
            .map(line =>
              line.replace(/^\d+\.\s+/, "")
            )
            .filter(Boolean);

          if (!items.length) {
            return block;
          }

          return (
            "<ol>" +
            items
              .map(item => `<li>${item}</li>`)
              .join("") +
            "</ol>"
          );
        }
      );


      /* Links */

      html = html.replace(
        /(https?:\/\/[^\s<]+)/g,
        '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
      );


      /* Paragraphs / line breaks */

      html = html
        .split(/\n{2,}/)
        .map(block => {

          const trimmed = block.trim();

          if (!trimmed) {
            return "";
          }

          if (
            trimmed.startsWith("<h1>") ||
            trimmed.startsWith("<h2>") ||
            trimmed.startsWith("<h3>") ||
            trimmed.startsWith("<ul>") ||
            trimmed.startsWith("<ol>") ||
            trimmed.startsWith("<pre>") ||
            trimmed.startsWith("<blockquote>") ||
            trimmed.startsWith("@@CODEBLOCK_")
          ) {
            return trimmed;
          }

          return (
            "<p>" +
            trimmed.replace(/\n/g, "<br>") +
            "</p>"
          );
        })
        .join("");


      /* Restore code blocks */

      codeBlocks.forEach(
        (block, index) => {
          html = html.replace(
            `@@CODEBLOCK_${index}@@`,
            block
          );
        }
      );


      return html;
    }


    /* =========================================================
       SCROLL
    ========================================================= */

    function scrollToBottom(smooth = true) {

      requestAnimationFrame(() => {

        chat.scrollTo({
          top: chat.scrollHeight,
          behavior: smooth ? "smooth" : "auto"
        });

      });

    }


    /* =========================================================
       WELCOME SCREEN
    ========================================================= */

    function removeWelcome() {

      if (welcome) {
        welcome.remove();
      }

    }


    /* =========================================================
       ADD MESSAGE
    ========================================================= */

    function addMessage(
      role,
      content,
      isError = false
    ) {

      removeWelcome();

      const row = document.createElement("div");

      row.className =
        "message-row " +
        (role === "user" ? "user" : "assistant");


      const bubble = document.createElement("div");

      bubble.className =
        "message " +
        (role === "user" ? "user" : "assistant");


      if (isError) {
        bubble.classList.add("error-message");
      }


      if (role === "assistant") {
        bubble.innerHTML = renderMarkdown(content);
      } else {
        bubble.textContent = content;
      }


      row.appendChild(bubble);

      chat.appendChild(row);

      scrollToBottom();

      return row;
    }


    /* =========================================================
       TYPING INDICATOR
    ========================================================= */

    function showTyping() {

      removeTyping();

      const row = document.createElement("div");

      row.id = "typingRow";
      row.className = "typing-row";

      row.innerHTML = `
        <div class="typing" aria-label="Huda is typing">
          <span></span>
          <span></span>
          <span></span>
        </div>
      `;

      chat.appendChild(row);

      scrollToBottom();

    }


    function removeTyping() {

      const existing =
        document.getElementById("typingRow");

      if (existing) {
        existing.remove();
      }

    }


    /* =========================================================
       BUTTON STATE
    ========================================================= */

    function setSendingState(value) {

      sending = value;

      sendButton.disabled = value;

      if (value) {
        sendButton.textContent = "Sending...";
      } else {
        sendButton.textContent = "Send";
      }

    }


    /* =========================================================
       TEXTAREA AUTO RESIZE
    ========================================================= */

    function resizeInput() {

      input.style.height = "auto";

      const height =
        Math.min(input.scrollHeight, 180);

      input.style.height = `${height}px`;

    }


    input.addEventListener(
      "input",
      resizeInput
    );


    /* =========================================================
       SEND MESSAGE
    ========================================================= */

    async function sendMessage() {

      if (sending) {
        return;
      }


      const message =
        input.value.trim();


      if (!message) {
        return;
      }


      input.value = "";

      resizeInput();

      addMessage(
        "user",
        message
      );


      conversation.push({
        role: "user",
        content: message
      });


      conversation =
        conversation.slice(-MAX_HISTORY);

      saveConversation();

      setSendingState(true);

      showTyping();


      try {

        const response =
          await fetch(API_URL, {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              message: message,
              history: conversation
            })
          });


        let data = null;

        try {
          data = await response.json();
        } catch {
          data = null;
        }


        removeTyping();


        if (!response.ok) {

          const errorText =
            data?.error ||
            `Request failed (${response.status}).`;

          throw new Error(errorText);
        }


        const reply =
          data?.reply ||
          data?.message ||
          data?.text;


        if (
          typeof reply !== "string" ||
          !reply.trim()
        ) {
          throw new Error(
            "Huda returned an empty response."
          );
        }


        addMessage(
          "assistant",
          reply
        );


        conversation.push({
          role: "assistant",
          content: reply
        });


        conversation =
          conversation.slice(-MAX_HISTORY);

        saveConversation();


      } catch (error) {

        removeTyping();

        console.error(
          "Huda request failed:",
          error
        );


        addMessage(
          "assistant",
          "I couldn't reach my server right now. Please try again.",
          true
        );

      } finally {

        setSendingState(false);

        input.focus();

      }

    }


    /* =========================================================
       FORM SUBMIT
    ========================================================= */

    composer.addEventListener(
      "submit",
      function (event) {

        event.preventDefault();

        sendMessage();

      }
    );


    /* =========================================================
       ENTER TO SEND
    ========================================================= */

    input.addEventListener(
      "keydown",
      function (event) {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* =========================================================
       RESTORE SAVED CHAT
    ========================================================= */

    function restoreConversation() {

      if (!conversation.length) {
        return;
      }


      removeWelcome();


      conversation.forEach(
        item => {

          addMessage(
            item.role,
            item.content
          );

        }
      );


      scrollToBottom(false);

    }


    /* =========================================================
       START
    ========================================================= */

    loadConversation();

    restoreConversation();

    resizeInput();

    input.focus();

  </script>

</body>
</html>
