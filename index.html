<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta name="theme-color" content="#0b0b0c" />

  <title>Gock</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0b0c;
      color: #f5f5f5;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    body {
      min-height: 100dvh;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    /* ------------------------------------------
       APP
    ------------------------------------------ */

    .app {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #0b0b0c;
    }

    /* ------------------------------------------
       HEADER
    ------------------------------------------ */

    .header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 88px;
      padding:
        calc(14px + env(safe-area-inset-top))
        18px
        14px
        18px;

      background: #0d0d0e;
      border-bottom: 1px solid #29292b;
    }

    .avatar {
      width: 54px;
      height: 54px;
      flex: 0 0 54px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;
      background: #f2f2f2;
      color: #111;
      font-size: 25px;
      font-weight: 700;
    }

    .header-info {
      min-width: 0;
      flex: 1;
    }

    .title {
      margin: 0;
      font-size: 22px;
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 6px;

      color: #8f8f93;
      font-size: 15px;
    }

    .status-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #31d47c;
      box-shadow: 0 0 10px rgba(49, 212, 124, 0.65);
    }

    .status-dot.offline {
      background: #777;
      box-shadow: none;
    }

    /* ------------------------------------------
       CHAT
    ------------------------------------------ */

    .chat {
      flex: 1 1 auto;
      min-height: 0;

      overflow-y: auto;
      overflow-x: hidden;

      padding:
        24px
        18px
        18px;

      scroll-behavior: smooth;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    .chat-inner {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;

      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ------------------------------------------
       MESSAGES
    ------------------------------------------ */

    .message-row {
      width: 100%;
      display: flex;
      animation: messageIn 0.16s ease-out;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.assistant {
      justify-content: flex-start;
    }

    .message {
      max-width: min(82%, 720px);

      padding: 14px 17px;

      border-radius: 22px;

      font-size: 17px;
      line-height: 1.55;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .message.user {
      background: #343436;
      color: #f7f7f7;

      border-bottom-right-radius: 7px;
    }

    .message.assistant {
      background: #202021;
      color: #f0f0f0;

      border: 1px solid #333335;
      border-bottom-left-radius: 7px;
    }

    .message.error {
      color: #ffb2b8;
      border-color: #714247;
      background: #241d1e;
    }

    .message a {
      color: #b8d7ff;
    }

    /* ------------------------------------------
       TYPING INDICATOR
    ------------------------------------------ */

    .typing-row {
      display: none;
      justify-content: flex-start;
      width: 100%;
    }

    .typing-row.visible {
      display: flex;
    }

    .typing {
      display: flex;
      align-items: center;
      gap: 7px;

      padding: 14px 18px;

      background: #202021;
      border: 1px solid #333335;
      border-radius: 22px;
      border-bottom-left-radius: 7px;
    }

    .typing span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #aaa;

      animation: typing 1.1s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    /* ------------------------------------------
       EMPTY STATE
    ------------------------------------------ */

    .empty {
      flex: 1;
      min-height: 55vh;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
      color: #777;
      font-size: 16px;
    }

    /* ------------------------------------------
       COMPOSER
    ------------------------------------------ */

    .composer-area {
      flex: 0 0 auto;

      padding:
        10px
        16px
        calc(12px + env(safe-area-inset-bottom))
        16px;

      background: #0b0b0c;
    }

    .composer {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;

      display: flex;
      align-items: flex-end;
      gap: 8px;

      padding: 6px;

      background: #171718;
      border: 1px solid #363638;
      border-radius: 27px;

      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    .composer:focus-within {
      border-color: #505052;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.025);
    }

    #messageInput {
      flex: 1;
      min-width: 0;

      resize: none;

      height: 52px;
      max-height: 150px;

      padding: 14px 14px;

      border: 0;
      outline: 0;

      background: transparent;
      color: #f5f5f5;

      font-size: 17px;
      line-height: 1.4;
    }

    #messageInput::placeholder {
      color: #77777b;
    }

    #sendButton {
      flex: 0 0 auto;

      min-width: 120px;
      height: 52px;

      padding: 0 20px;

      border-radius: 22px;

      background: #f5f5f5;
      color: #111;

      font-size: 17px;
      font-weight: 700;

      transition:
        transform 0.1s ease,
        opacity 0.15s ease;
    }

    #sendButton:active {
      transform: scale(0.97);
    }

    #sendButton:disabled {
      cursor: default;
      opacity: 0.55;
    }

    /* ------------------------------------------
       SCROLLBAR
    ------------------------------------------ */

    .chat::-webkit-scrollbar {
      width: 6px;
    }

    .chat::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat::-webkit-scrollbar-thumb {
      background: #343436;
      border-radius: 10px;
    }

    /* ------------------------------------------
       ANIMATIONS
    ------------------------------------------ */

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes typing {
      0%,
      60%,
      100% {
        opacity: 0.35;
        transform: translateY(0);
      }

      30% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    /* ------------------------------------------
       MOBILE
    ------------------------------------------ */

    @media (max-width: 600px) {
      .header {
        min-height: 86px;
        padding-left: 18px;
        padding-right: 18px;
      }

      .avatar {
        width: 52px;
        height: 52px;
        flex-basis: 52px;
      }

      .chat {
        padding:
          22px
          12px
          14px;
      }

      .message {
        max-width: 88%;
        font-size: 17px;
      }

      .composer-area {
        padding-left: 10px;
        padding-right: 10px;
      }

      #sendButton {
        min-width: 108px;
        padding-left: 16px;
        padding-right: 16px;
      }
    }

    @media (max-width: 390px) {
      .message {
        max-width: 92%;
      }

      #sendButton {
        min-width: 92px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- ========================================
         HEADER
    ========================================= -->

    <header class="header">

      <div class="avatar" aria-hidden="true">
        G
      </div>

      <div class="header-info">
        <h1 class="title">
          Gock
        </h1>

        <div class="status">
          <span
            id="statusDot"
            class="status-dot"
          ></span>

          <span id="statusText">
            Gemini-powered
          </span>
        </div>
      </div>

    </header>


    <!-- ========================================
         CHAT AREA
    ========================================= -->

    <main
      id="chat"
      class="chat"
      aria-live="polite"
    >

      <div
        id="chatInner"
        class="chat-inner"
      >

        <div
          id="emptyState"
          class="empty"
        >
          <div>
            <div style="font-size: 18px; margin-bottom: 6px;">
              Gock
            </div>

            <div>
              Go ahead. Say something.
            </div>
          </div>
        </div>

        <!-- Typing indicator -->

        <div
          id="typingRow"
          class="typing-row"
        >

          <div class="typing">
            <span></span>
            <span></span>
            <span></span>
          </div>

        </div>

      </div>

    </main>


    <!-- ========================================
         COMPOSER
    ========================================= -->

    <section class="composer-area">

      <form
        id="composer"
        class="composer"
        autocomplete="off"
      >

        <textarea
          id="messageInput"
          rows="1"
          maxlength="10000"
          placeholder="Talk to Gock..."
          aria-label="Message Gock"
          enterkeyhint="send"
        ></textarea>

        <button
          id="sendButton"
          type="submit"
        >
          Send
        </button>

      </form>

    </section>

  </div>


  <script>
    "use strict";

    // ==================================================
    // Gock frontend configuration
    // ==================================================

    const API_URL = "/api/message";

    const MAX_HISTORY = 12;

    const STORAGE_KEY = "gock_chat_history_v1";


    // ==================================================
    // DOM
    // ==================================================

    const chat = document.getElementById("chat");

    const chatInner =
      document.getElementById("chatInner");

    const emptyState =
      document.getElementById("emptyState");

    const typingRow =
      document.getElementById("typingRow");

    const composer =
      document.getElementById("composer");

    const messageInput =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");

    const statusDot =
      document.getElementById("statusDot");

    const statusText =
      document.getElementById("statusText");


    // ==================================================
    // State
    // ==================================================

    let messages = [];

    let sending = false;


    // ==================================================
    // Default context
    // ==================================================

    const gockContext = {
      identity: "I'm Gock, an AI assistant.",

      personality:
        "Friendly, direct, intelligent, conversational, and helpful.",

      purpose:
        "Help the user with questions, coding, writing, reasoning, learning, and everyday tasks."
    };


    // ==================================================
    // Local storage
    // ==================================================

    function loadHistory() {
      try {
        const saved =
          localStorage.getItem(STORAGE_KEY);

        if (!saved) {
          return [];
        }

        const parsed =
          JSON.parse(saved);

        if (!Array.isArray(parsed)) {
          return [];
        }

        return parsed
          .filter(item => {
            return (
              item &&
              typeof item === "object" &&
              (item.role === "user" ||
               item.role === "assistant") &&
              typeof item.content === "string"
            );
          })
          .slice(-MAX_HISTORY);

      } catch (error) {
        console.warn(
          "Could not load Gock history:",
          error
        );

        return [];
      }
    }


    function saveHistory() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(
            messages.slice(-MAX_HISTORY)
          )
        );
      } catch (error) {
        console.warn(
          "Could not save Gock history:",
          error
        );
      }
    }


    // ==================================================
    // Rendering
    // ==================================================

    function hideEmptyState() {
      if (emptyState) {
        emptyState.style.display = "none";
      }
    }


    function addMessage(role, text, isError = false) {
      hideEmptyState();

      const row =
        document.createElement("div");

      row.className =
        `message-row ${role}`;


      const bubble =
        document.createElement("div");

      bubble.className =
        `message ${role}`;

      if (isError) {
        bubble.classList.add("error");
      }

      bubble.textContent = text;


      row.appendChild(bubble);

      chatInner.insertBefore(
        row,
        typingRow
      );

      scrollToBottom();

      return bubble;
    }


    function renderHistory() {
      const rows =
        chatInner.querySelectorAll(
          ".message-row"
        );

      rows.forEach(row => row.remove());

      if (messages.length === 0) {
        if (emptyState) {
          emptyState.style.display = "flex";
        }

        return;
      }

      hideEmptyState();

      messages.forEach(message => {
        addMessage(
          message.role,
          message.content
        );
      });

      scrollToBottom();
    }


    // ==================================================
    // Typing indicator
    // ==================================================

    function setTyping(visible) {
      if (visible) {
        typingRow.classList.add("visible");
      } else {
        typingRow.classList.remove("visible");
      }

      scrollToBottom();
    }


    // ==================================================
    // Status
    // ==================================================

    function setOnline() {
      statusDot.classList.remove("offline");
      statusText.textContent =
        "Gemini-powered";
    }


    function setOffline() {
      statusDot.classList.add("offline");
      statusText.textContent =
        "Connection problem";
    }


    // ==================================================
    // Scroll
    // ==================================================

    function scrollToBottom() {
      requestAnimationFrame(() => {
        chat.scrollTop =
          chat.scrollHeight;
      });
    }


    // ==================================================
    // Input auto resize
    // ==================================================

    function resizeInput() {
      messageInput.style.height = "auto";

      const height =
        Math.min(
          messageInput.scrollHeight,
          150
        );

      messageInput.style.height =
        `${height}px`;
    }


    // ==================================================
    // Send button state
    // ==================================================

    function updateSendButton() {
      const hasText =
        messageInput.value.trim().length > 0;

      sendButton.disabled =
        sending || !hasText;

      if (sending) {
        sendButton.textContent =
          "Sending...";
      } else {
        sendButton.textContent =
          "Send";
      }
    }


    // ==================================================
    // Send message to Gock
    // ==================================================

    async function sendMessage() {
      if (sending) {
        return;
      }

      const text =
        messageInput.value.trim();

      if (!text) {
        return;
      }

      sending = true;

      updateSendButton();

      messageInput.value = "";

      resizeInput();

      // Add user message immediately.
      const userMessage = {
        role: "user",
        content: text
      };

      messages.push(userMessage);

      messages =
        messages.slice(-MAX_HISTORY);

      saveHistory();

      addMessage(
        "user",
        text
      );

      setTyping(true);


      try {
        /*
         * Send only the recent conversation.
         * Keeping this small makes requests faster.
         */

        const historyForServer =
          messages.slice(-MAX_HISTORY);


        const response =
          await fetch(API_URL, {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              message: text,

              messages:
                historyForServer,

              context:
                gockContext
            })
          });


        let data = null;

        try {
          data =
            await response.json();
        } catch {
          throw new Error(
            "The server returned an invalid response."
          );
        }


        if (!response.ok) {
          throw new Error(
            data?.error ||
            `Server error (${response.status}).`
          );
        }


        const reply =
          typeof data?.reply === "string"
            ? data.reply.trim()
            : "";


        if (!reply) {
          throw new Error(
            "Gock returned an empty response."
          );
        }


        // Add assistant response.
        const assistantMessage = {
          role: "assistant",
          content: reply
        };

        messages.push(
          assistantMessage
        );

        messages =
          messages.slice(-MAX_HISTORY);

        saveHistory();

        setTyping(false);

        addMessage(
          "assistant",
          reply
        );

        setOnline();

      } catch (error) {
        console.error(
          "Gock request failed:",
          error
        );

        setTyping(false);

        setOffline();

        addMessage(
          "assistant",
          error?.message ||
            "Gock could not connect to Gemini.",
          true
        );

      } finally {
        sending = false;

        updateSendButton();

        messageInput.focus();
      }
    }


    // ==================================================
    // Form submit
    // ==================================================

    composer.addEventListener(
      "submit",
      event => {
        event.preventDefault();

        sendMessage();
      }
    );


    // ==================================================
    // Keyboard behavior
    // ==================================================

    messageInput.addEventListener(
      "input",
      () => {
        resizeInput();
        updateSendButton();
      }
    );


    messageInput.addEventListener(
      "keydown",
      event => {

        /*
         * Enter sends.
         *
         * Shift + Enter creates a new line.
         */

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {
          event.preventDefault();

          sendMessage();
        }
      }
    );


    // ==================================================
    // Prevent accidental page movement
    // ==================================================

    document.addEventListener(
      "touchmove",
      event => {
        if (
          event.target === messageInput
        ) {
          return;
        }
      },
      { passive: true }
    );


    // ==================================================
    // Initial startup
    // ==================================================

    function initialize() {
      messages =
        loadHistory();

      renderHistory();

      resizeInput();

      updateSendButton();

      setOnline();

      messageInput.focus();

      scrollToBottom();
    }


    initialize();
  </script>

</body>
</html>
